services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-georef_studio}
      POSTGRES_USER: ${POSTGRES_USER:-georef}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-georef_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-georef} -d ${POSTGRES_DB:-georef_studio}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      APP_NAME: GeoRef Studio API
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://georef:georef_dev_password@postgres:5432/georef_studio
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /app/storage
      CORS_ORIGINS: http://localhost:3003
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./backend/app:/app/app
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: /api
      VITE_API_PROXY_TARGET: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-3003}:3003"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    depends_on:
      - backend

volumes:
  postgres_data:
